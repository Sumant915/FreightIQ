services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: freightiq-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: freightiq
      POSTGRES_USER: freightiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - freightiq_pgdata:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightiq -d freightiq"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  freightiq_pgdata:
